name: Approve Test
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  pull-requests: write
jobs:
  approve:
    if: github.event.issue.pull_request != null && github.event.comment.body == '/approve'
    runs-on: ubuntu-latest
    steps:
      - name: Post APPROVE as github-actions[bot]
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.head.sha')
          gh api -X POST "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" \
            -f event=APPROVE -f commit_id="$SHA" -f body="Automated approval (PoC)" --jq '.state,.user.login'
